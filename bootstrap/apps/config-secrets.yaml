# Magasin de secrets AWS ; la région vient des métadonnées
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: config-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          enable_external_secrets: 'true'
  template:
    metadata:
      name: config-secrets
    spec:
      project: platform
      source:
        repoURL: https://github.com/cloudarmelpro/gitops-config.git
        targetRevision: main
        path: platform/external-secrets
        kustomize:
          patches:
          - target:
              kind: ClusterSecretStore
              name: aws-secrets-manager
            patch: |
              - op: replace
                path: /spec/provider/aws/region
                value: {{ index .metadata.annotations "aws_region" }}
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
