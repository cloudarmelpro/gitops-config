# Catalogue de politiques et exceptions (dossier policies/kyverno)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: politiques
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          enable_politiques: 'true'
  template:
    metadata:
      name: politiques
    spec:
      project: platform
      source:
        repoURL: https://github.com/cloudarmelpro/gitops-config.git
        targetRevision: main
        path: policies/kyverno
        directory:
          recurse: true
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
