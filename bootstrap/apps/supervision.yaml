# Prometheus et Grafana ; fournit les CRD ServiceMonitor
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: supervision
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          enable_supervision: 'true'
  template:
    metadata:
      name: supervision
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 92.17.0
        helm:
          valuesObject:
            prometheus:
              prometheusSpec:
                serviceMonitorSelectorNilUsesHelmValues: false
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
