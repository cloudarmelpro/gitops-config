# Prometheus et Grafana ; fournit les CRD ServiceMonitor
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: supervision
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          enable_supervision: 'true'
  template:
    metadata:
      name: supervision
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 92.17.0
        helm:
          valuesObject:
            # Grafana publié en HTTPS (mot de passe administrateur aléatoire) ; Prometheus publié derrière
            # une authentification Traefik (platform/monitoring/acces-prometheus.yaml) ; Alertmanager interne.
            grafana:
              ingress:
                enabled: true
                ingressClassName: traefik
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt
                hosts: [grafana.elyse-cloud.duckdns.org]
                tls:
                - secretName: grafana-tls
                  hosts: [grafana.elyse-cloud.duckdns.org]
              grafana.ini:
                server:
                  root_url: https://grafana.elyse-cloud.duckdns.org
            prometheus:
              ingress:
                enabled: true
                ingressClassName: traefik
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt
                  traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
                hosts: [prometheus.elyse-cloud.duckdns.org]
                tls:
                - secretName: prometheus-tls
                  hosts: [prometheus.elyse-cloud.duckdns.org]
              prometheusSpec:
                externalUrl: https://prometheus.elyse-cloud.duckdns.org
                serviceMonitorSelectorNilUsesHelmValues: false
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
