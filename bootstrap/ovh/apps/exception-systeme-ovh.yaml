# Composants système d'OVH Managed Kubernetes (réseau, proxy, agents) : comme pour EKS, ils ont besoin
# d'accéder au nœud. Exception limitée à kube-system et aux trois politiques concernées.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: composants-ovh
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    justification: "Composants système gérés par OVHcloud : ils ont besoin d'accéder au réseau et au noyau du nœud."
spec:
  exceptions:
    - policyName: disallow-host-access
      ruleNames: [host-namespaces, host-path, autogen-host-namespaces, autogen-host-path]
    - policyName: disallow-privileged-containers
      ruleNames: [privileged-containers, autogen-privileged-containers]
    - policyName: require-run-as-non-root
      ruleNames: [run-as-non-root, autogen-run-as-non-root]
  match:
    any:
      - resources:
          kinds: [Pod, DaemonSet, Deployment, ReplicaSet]
          namespaces: [kube-system]
