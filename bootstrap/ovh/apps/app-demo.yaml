# L'application, avec la même base que sur EKS ; seule l'image change de registre (GitHub Container Registry)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-demo-ovh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: applications
  source:
    repoURL: https://github.com/cloudarmelpro/gitops-config.git
    targetRevision: main
    path: apps/app-demo/overlays/ovh
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-ovh
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
