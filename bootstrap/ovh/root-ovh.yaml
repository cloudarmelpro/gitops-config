# Application racine du cluster de démonstration OVH (appliquée par outils/demo-ovh-demarrer.sh).
# Elle ne reprend que les composants portables : pas d'External Secrets ni de Load Balancer Controller, propres à AWS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cloudarmelpro/gitops-config.git
    targetRevision: main
    path: bootstrap/ovh/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
