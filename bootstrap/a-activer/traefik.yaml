# Point d'entrée HTTP(S) des applications, exposé par un NLB sur l'IP fixe du socle
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.3.0"
    helm:
      valuesObject:
        deployment:
          replicas: 2
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: external
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            # une IP fixe par zone (même ordre que les sous-réseaux) ; répartition entre zones activée
            service.beta.kubernetes.io/aws-load-balancer-subnets: gitops-dev-public-eu-west-3a,gitops-dev-public-eu-west-3b,gitops-dev-public-eu-west-3c
            service.beta.kubernetes.io/aws-load-balancer-eip-allocations: <ID_ALLOCATION_EIP_A>,<ID_ALLOCATION_EIP_B>,<ID_ALLOCATION_EIP_C>
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
