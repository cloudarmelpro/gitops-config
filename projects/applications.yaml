apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
spec:
  description: Applications métier, périmètre restreint
  sourceRepos:
    - https://github.com/cloudarmelpro/uaa-platform-gitops.git
  destinations:   # une application = trois espaces : <application>-dev, -staging, -prod
    - { server: https://kubernetes.default.svc, namespace: '*-dev' }
    - { server: https://kubernetes.default.svc, namespace: '*-staging' }
    - { server: https://kubernetes.default.svc, namespace: '*-prod' }
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: rbac.authorization.k8s.io
      kind: '*'
