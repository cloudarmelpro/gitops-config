name: validation
on: [pull_request]
permissions:
  contents: read
jobs:
  politiques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Kyverno CLI (version du cluster)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v1.19.2   # même version que le chart Kyverno 3.9.2 du cluster (la v1.20 n'exécute plus les ClusterPolicy)
          curl -sSL -o kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${VERSION}/kyverno-cli_${VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz kyverno && sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Tests des politiques
        run: kyverno test policies/tests/

      - name: Manifestes conformes aux politiques
        run: |
          for app in apps/*/; do
            for env in dev staging prod; do
              echo "== $(basename "$app") ($env)"
              kustomize build "${app}overlays/$env" > /tmp/manifestes.yaml
              kyverno apply policies/kyverno/ --resource /tmp/manifestes.yaml --values-file policies/tests/valeurs-ci.yaml
            done
          done
