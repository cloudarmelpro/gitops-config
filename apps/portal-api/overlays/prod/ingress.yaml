# Publication de l'API du portail (prod) en HTTPS, sous /api (certificat Let's Encrypt obtenu par cert-manager)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [prod.elyse-cloud.duckdns.org]
      secretName: portal-api-tls
  rules:
    - host: prod.elyse-cloud.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: portal-api, port: { number: 80 } }
