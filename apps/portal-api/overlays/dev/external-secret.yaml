# Activé à l'étape « Secrets » du ROADMAP (kustomize edit add resource external-secret.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-api-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: portal-api-secrets
  data:
    - secretKey: password
      remoteRef:
        key: uaa/dev/portal-api
        property: password
