apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portal-api-dev
resources:
- ../../base
- ingress.yaml
- external-secret.yaml
images:
- name: portal-api
  newName: 181975986285.dkr.ecr.us-east-1.amazonaws.com/uaa/portal-api
  newTag: sha-0c141ac
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: portal-api
- path: secret-env-patch.yaml
