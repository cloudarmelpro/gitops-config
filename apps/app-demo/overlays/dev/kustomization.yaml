apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
- ../../base
- ingress.yaml
- external-secret.yaml
images:
- name: app-demo
  newName: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/app-demo
  newTag: a-remplacer-par-la-ci
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: app-demo
- path: secret-env-patch.yaml
