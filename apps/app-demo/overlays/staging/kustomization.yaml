apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: app-demo
    newName: <ACCOUNT_ID>.dkr.ecr.eu-west-3.amazonaws.com/app-demo
    newTag: "a-remplacer-par-la-ci"
patches:
  - target: { kind: Deployment, name: app-demo }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
